<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Blog Preview Card</title>
</head>
<body>
    <main class="main-container">
        <article class="card">
            <img src="assets/images/illustration-article.svg" alt="Drawers" class="card-imagem">
            <div class="card-content">
                <span class="category">Learning</span>
                <span class="published-date">Published 21 Dec 2023</span>
                <h1 class="title-card">HTML & CSS foundations</h1>
                <p class="paragrafh-description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
            </div>
            <div class="card-author">
                <img src="assets/images/image-avatar.webp" alt="Greg Hopper, Author" class="author-photo">
                <span class="author-name">Greg Hopper</span>
            </div>
        </article>
        <footer class="credits">Challenge by <a rel="noopener noreferrer" href="https://www.frontendmentor.io/" target="_blank">Frontend Mentor</a>. Coded by <a rel="noopener noreferrer" href="https://github.com/LuCapitani" target="_blank">Luis Felipe Capitani</a>.</footer>
    </main>
</body>
</html>
